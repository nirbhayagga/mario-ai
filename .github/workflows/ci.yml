name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # ubuntu-latest moved to 26.04, which setup-python has no 3.9 build for
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      # opencv-python (not the headless build) links against libGL at import time
      - name: Install system libraries
        run: sudo apt-get update -q && sudo apt-get install -y -q libgl1

      # gym 0.21 only installs with these exact build tools
      - name: Pin build tooling
        run: pip install "pip<24.1" "setuptools==65.5.0" "wheel==0.38.4"

      # CPU wheel is a fraction of the default CUDA download
      - name: Install CPU-only torch
        run: pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Test
        run: pytest -q
